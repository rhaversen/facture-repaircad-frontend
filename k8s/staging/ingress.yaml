apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: frontend-ingress
    namespace: facture-repaircad-staging
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
    ingressClassName: nginx
    tls:
        -   hosts:
                - staging.repaircad.facture.live
            secretName: frontend-tls
    rules:
        -   host: staging.repaircad.facture.live
            http:
                paths:
                    -   backend:
                            service:
                                name: frontend-service
                                port:
                                    number: 80
                        path: /
                        pathType: Prefix
